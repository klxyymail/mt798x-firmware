name: Build MT798X Closed-Driver Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: '要编译的机型（all 表示全部 4 个）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cmcc_rax3000m-256m-nand
          - cmcc_rax3000m-emcc
          - cmcc_rax3000m-nand
          - cmcc_xr30-emmc
      ip:
        description: 'LAN 口默认地址'
        required: false
        default: '192.168.6.1'
        type: string
      author:
        description: '固件署名'
        required: false
        default: 'WorkBuddy'
        type: string
      jobs:
        description: '编译线程数'
        required: false
        default: '4'
        type: string
      release:
        description: '是否创建 Release（默认勾选）'
        required: false
        default: true
        type: boolean
      custom_plugins:
        description: '自定义插件名称，空格分隔（留空则不添加）。例：luci-app-zerotier luci-app-socat'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [build]

permissions:
  contents: write

jobs:
  setup:
    name: 读取配置并计算构建参数
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.select.outputs.devices }}
      tag: ${{ steps.tag.outputs.tag }}
      source_tag: ${{ steps.config.outputs.source_tag }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 唯一配置源：机型与源码版本都从 build.config 读取，不在 workflow 里重复维护。
      - name: 读取 build.config
        id: config
        run: |
          source ./build.config
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          devs=""
          for d in "${DEVICES[@]}"; do
            key="${d%%|*}"
            [ -n "$devs" ] && devs="$devs,"
            devs="$devs\"$key\""
          done
          echo "all_devices=[$devs]" >> "$GITHUB_OUTPUT"
          echo "源码版本=$SOURCE_TAG，机型=[$devs]"

      - name: 计算发布标签
        id: tag
        run: echo "tag=$(TZ=Asia/Shanghai date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 选择机型
        id: select
        env:
          EVENT: ${{ github.event_name }}
          DEVICE: ${{ inputs.device }}
          ALL: ${{ steps.config.outputs.all_devices }}
        run: |
          case "$DEVICE" in
            cmcc_rax3000m-256m-nand|cmcc_rax3000m-emcc|cmcc_rax3000m-nand|cmcc_xr30-emmc)
              if [ "$EVENT" = "workflow_dispatch" ]; then
                printf 'devices=["%s"]\n' "$DEVICE" >> "$GITHUB_OUTPUT"
              else
                printf 'devices=%s\n' "$ALL" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              printf 'devices=%s\n' "$ALL" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: 编译 - ${{ matrix.device }}
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.setup.outputs.devices) }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -hT

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev qemu-utils ccache
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

      - name: 准备源码与 feeds
        env:
          LAN_IP: ${{ inputs.ip || '192.168.6.1' }}
          AUTHOR: ${{ inputs.author || 'WorkBuddy' }}
          CUSTOM_PLUGINS: ${{ inputs.custom_plugins || '' }}
        run: ./scripts/prepare.sh

      - name: 恢复工具链与下载包缓存
        uses: actions/cache@v4
        with:
          path: |
            source/staging_dir
            source/dl
            source/.ccache
          key: ${{ runner.os }}-mt798x-staging-${{ needs.setup.outputs.source_tag }}-${{ hashFiles('build.config') }}
          restore-keys: |
            ${{ runner.os }}-mt798x-staging-${{ needs.setup.outputs.source_tag }}-
            ${{ runner.os }}-mt798x-staging-

      - name: 配置 ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/source/.ccache" >> "$GITHUB_ENV"
          ccache -M 8G
          ccache -z

      - name: 编译固件
        env:
          CUSTOM_PLUGINS: ${{ inputs.custom_plugins || '' }}
        run: |
          ./scripts/build.sh --skip-prepare \
            --device "${{ matrix.device }}" \
            --ip "${{ inputs.ip || '192.168.6.1' }}" \
            --author "${{ inputs.author || 'WorkBuddy' }}" \
            --jobs "${{ inputs.jobs || '4' }}"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}
          path: |
            firmware/${{ matrix.device }}/*
            firmware/SHA256SUMS
            firmware/BUILD_INFO.txt
          if-no-files-found: error

  release:
    name: 发布固件到 Release
    needs: [setup, build]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部机型固件
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      - name: 整理发布文件
        env:
          LAN_IP: ${{ inputs.ip || '192.168.6.1' }}
          AUTHOR: ${{ inputs.author || 'WorkBuddy' }}
          CUSTOM_PLUGINS: ${{ inputs.custom_plugins || '' }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.bin' -o -name '*.manifest' \) -exec cp -f {} release/ \;
          cd release
          sha256sum *.bin > SHA256SUMS
          cd ..
          {
            echo '闭源驱动固件（MT7981 / mt_wifi）'
            echo
            echo '包含机型：'
            for f in release/*.bin; do echo "- $(basename "$f")"; done
            echo
            echo "LAN：$LAN_IP"
            echo "署名：$AUTHOR"
            if [ -n "$CUSTOM_PLUGINS" ]; then echo "自定义插件：$CUSTOM_PLUGINS"; fi
            echo
            echo '插件：见固件内 /usr/lib/opkg/status 或随附 manifest'
          } > release/RELEASE_BODY.md
          ls -lh release

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.source_tag }}-${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.source_tag }}-${{ needs.setup.outputs.tag }}
          body_path: release/RELEASE_BODY.md
          files: |
            release/*.bin
            release/*.manifest
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
