name: Build MT798X Closed-Driver Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: '要编译的机型（all 表示全部 4 个）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cmcc_rax3000m-256m-nand
          - cmcc_rax3000m-emmc
          - cmcc_rax3000m-nand
          - cmcc_xr30-emmc
      ip:
        description: 'LAN 口默认地址'
        required: false
        default: '192.168.2.1'
        type: string
      author:
        description: '固件署名'
        required: false
        default: 'WorkBuddy'
        type: string
      jobs:
        description: '编译线程数'
        required: false
        default: '4'
        type: string
      release:
        description: '是否创建 Release'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [build]

permissions:
  contents: write

env:
  SOURCE_TAG: v25.12.6

jobs:
  build:
    name: 编译 - ${{ matrix.device }}
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.device == 'all' ||
      matrix.device == inputs.device
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device:
          - cmcc_rax3000m-256m-nand
          - cmcc_rax3000m-emmc
          - cmcc_rax3000m-nand
          - cmcc_xr30-emmc

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -hT

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev qemu-utils ccache
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

      - name: 设置构建变量
        run: echo "TAG=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: 编译固件
        run: |
          ./scripts/build.sh \
            --device "${{ matrix.device }}" \
            --ip "${{ inputs.ip || '192.168.2.1' }}" \
            --author "${{ inputs.author || 'WorkBuddy' }}" \
            --jobs "${{ inputs.jobs || '4' }}"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}
          path: |
            firmware/${{ matrix.device }}/*
            firmware/SHA256SUMS
            firmware/BUILD_INFO.txt
          if-no-files-found: error

      - name: 创建 Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SOURCE_TAG }}-${{ env.TAG }}
          name: ${{ env.SOURCE_TAG }}-${{ env.TAG }}
          body: |
            闭源驱动固件（MT7981 / mt_wifi）

            机型：${{ matrix.device }}
            LAN：${{ inputs.ip || '192.168.2.1' }}
            插件：见固件内 /usr/lib/opkg/status 或随附 manifest
          files: firmware/${{ matrix.device }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
